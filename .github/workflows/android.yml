
name: Build DriverGuard AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DriverGuardAI_Demo1_Source_FIXED.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          if [ ! -f "DriverGuardAI_Demo1_Source_FIXED.zip" ]; then
            echo "ERROR: Source ZIP not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source code
        run: |
          mkdir -p source
          unzip -q DriverGuardAI_Demo1_Source_FIXED.zip -d source
          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          if [ -f "source/DriverGuardAI/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=source/DriverGuardAI" >> $GITHUB_ENV
          elif [ -f "source/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=source" >> $GITHUB_ENV
          else
            echo "ERROR: Cannot find settings.gradle.kts"
            find source -name settings.gradle.kts
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Check APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverGuardAI-Demo1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
