name: Build DriverGuard AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DriverGuardAI_Demo1_Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source code
        run: |
          unzip -q DriverGuardAI_Demo1_Source.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/DriverGuardAI
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverGuardAI-Demo1-APK
          path: source/DriverGuardAI/app/build/outputs/apk/debug/app-debug.apk
