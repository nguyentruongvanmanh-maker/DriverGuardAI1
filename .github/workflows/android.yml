
name: Build DriverGuard AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DriverGuardAI_Demo1_Source_FIXED2.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f DriverGuardAI_Demo1_Source_FIXED2.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          mkdir source
          unzip -q DriverGuardAI_Demo1_Source_FIXED2.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/DriverGuardAI
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverGuardAI-Demo1-APK
          path: source/DriverGuardAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
